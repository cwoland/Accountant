<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6af7"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3a5"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <rect x="80" y="280" width="60" height="160" rx="10" fill="url(#accent)" opacity="0.9"/>
  <rect x="160" y="200" width="60" height="240" rx="10" fill="url(#accent)"/>
  <rect x="240" y="240" width="60" height="200" rx="10" fill="url(#accent)" opacity="0.7"/>

  <polyline
    points="110,220 190,160 270,190 370,100"
    fill="none"
    stroke="url(#green)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="370" cy="100" r="16" fill="#22d3a5"/>
  <circle cx="370" cy="100" r="8" fill="#fff"/>

  <circle cx="390" cy="350" r="80" fill="url(#accent)" opacity="0.15"
    stroke="#7c6af7" stroke-width="3"/>
  <circle cx="390" cy="350" r="60" fill="url(#accent)" opacity="0.2"/>
  <text x="390" y="370" text-anchor="middle"
    font-family="Arial, sans-serif" font-weight="900"
    font-size="64" fill="#f2f2f2">₽</text>
</svg>